<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitOps Service Creator</title>
    <!-- Tailwind CSS per una grafica moderna senza scrivere CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-height-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 text-center">Crea Microservizio GitOps</h1>
        
        <form id="serviceForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Service name</label>
                <input type="text" id="name" placeholder="es. payment-api" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Namespace Kubernetes (Team)</label>
                <input type="text" id="namespace" placeholder="es. finance" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Container image</label>
                <input type="text" id="image" placeholder="es. nginx:1:29" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Container port (to be exposed)</label>
                <input type="number" id="port" placeholder="es. 8080" required
                    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" 
                class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Genera e Pusha su GitOps
            </button>
        </form>

        <!-- Area per i messaggi di successo o errore -->
        <div id="result" class="mt-4 p-3 rounded hidden text-center font-medium"></div>
    </div>

    <script>
        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            resultDiv.className = "mt-4 p-3 rounded text-center font-medium bg-gray-200 text-gray-700";
            resultDiv.innerText = "Invio in corso...";
            resultDiv.classList.remove('hidden');

            // Raccogliamo i dati dal form
            const data = {
                name: document.getElementById('name').value,
                namespace: document.getElementById('namespace').value,
                image: document.getElementById('image').value,
                port: parseInt(document.getElementById('port').value)
            };

            try {
                // Inviamo i dati al backend Go
                const response = await fetch('http://portal-backend.gitops-portal.svc.cluster.local:8080/api/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok) {
                    resultDiv.className = "mt-4 p-3 rounded text-center font-medium bg-green-100 text-green-700";
                    resultDiv.innerText = "Successo! " + result.message;
                } else {
                    resultDiv.className = "mt-4 p-3 rounded text-center font-medium bg-red-100 text-red-700";
                    resultDiv.innerText = "Errore: " + result.error;
                }
            } catch (err) {
                resultDiv.className = "mt-4 p-3 rounded text-center font-medium bg-red-100 text-red-700";
                resultDiv.innerText = "Impossibile connettersi al backend.";
            }
        });
    </script>
</body>
</html>
